name: Linux Cloud VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Install and Setup Tailscale
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        # دانلود و نصب Tailscale
        curl -fsSL https://tailscale.com/install.sh | sh
        
        # اتصال به شبکه Tailscale
        sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-ubuntu-server"
        
        # تنظیم رمز عبور برای یوزر runner
        echo "runner:P@ssw0rd1qazXSW@#" | sudo chpasswd
        
        # فعال‌سازی دسترسی SSH با رمز عبور
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
        sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
        sudo service ssh restart

        # دریافت آی‌پی
        TS_IP=$(tailscale ip -4)

        # نمایش اطلاعات ورود در لاگ
        echo ""
        echo "=========================================="
        echo "  >>> LINUX SERVER IS READY! <<<"
        echo "  Tailscale IP : $TS_IP"
        echo "  Username     : runner"
        echo "  Password     : P@ssw0rd1qazXSW@#"
        echo "  >> Connect via SSH: ssh runner@$TS_IP"
        echo "=========================================="

    - name: Keep Alive (6 Hours)
      run: |
        for i in {1..360}; do
          echo "[$i/360] Server running..."
          sleep 60
        done
